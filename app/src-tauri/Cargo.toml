[package]
name = "hampy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Hampy — a modern, modular MobaXterm-class connection manager."
default-run = "hampy"

[lib]
name = "hampy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hampy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Hampy crates
hampy-core = { workspace = true }
hampy-settings = { workspace = true }
hampy-terminal = { workspace = true }
hampy-ssh = { workspace = true }
hampy-sftp = { workspace = true }
hampy-ftp = { workspace = true }
hampy-serial = { workspace = true }
hampy-rdp = { workspace = true }
hampy-vnc = { workspace = true }
hampy-workspace = { workspace = true }
hampy-updater = { workspace = true }

# Tauri runtime
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

# OS keychain for credential storage (native backends per platform).
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

# Shared
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }

[features]
# Default to using a webview-served frontend in production.
custom-protocol = ["tauri/custom-protocol"]
